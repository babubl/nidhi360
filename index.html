<style>
/* ===== Tokens ===== */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --surface-2:#EAEEF7; --text:#141B3A; --muted:#566086; --line:#D6DCEA;
  --primary:#1B2550; --on-primary:#FFFFFF; --stamp:#5B3E9E; --stamp-bg:#F1ECFB; --hi:#F2B632;
  --ok:#1C7A52; --ok-bg:#E3F3EA; --warn:#8A5A00; --warn-bg:#FBF0D6; --bad:#B3261E; --bad-bg:#FBE6E4;
  --focus:#F2B632; --radius:10px; --radius-lg:16px;
  --shadow:0 1px 0 rgba(20,27,58,.06), 0 8px 24px -16px rgba(20,27,58,.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1226; --surface:#151B36; --surface-2:#1C2446; --text:#E8ECFA; --muted:#A3ACCC; --line:#2B3560;
    --primary:#B9C6FF; --on-primary:#0D1226; --stamp:#C6B3FF; --stamp-bg:#251E43; --hi:#F2B632;
    --ok:#6BD3A2; --ok-bg:#12302A; --warn:#F2C35B; --warn-bg:#33290F; --bad:#FF8A80; --bad-bg:#3A1A1C;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1226; --surface:#151B36; --surface-2:#1C2446; --text:#E8ECFA; --muted:#A3ACCC; --line:#2B3560;
  --primary:#B9C6FF; --on-primary:#0D1226; --stamp:#C6B3FF; --stamp-bg:#251E43; --hi:#F2B632;
  --ok:#6BD3A2; --ok-bg:#12302A; --warn:#F2C35B; --warn-bg:#33290F; --bad:#FF8A80; --bad-bg:#3A1A1C;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.6);
}

/* ===== Base ===== */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Catamaran","Noto Sans Tamil",system-ui,sans-serif;font-size:17px;line-height:1.55}
:lang(ta) body, body.ta{line-height:1.7}
a{color:var(--primary);text-underline-offset:3px}
h1,h2,h3{line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2rem,5.2vw,3.4rem);font-weight:800;letter-spacing:-.025em}
h2{font-size:clamp(1.45rem,3vw,1.9rem);font-weight:800}
h3{font-size:1.15rem;font-weight:700}
p{margin:0 0 1em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ===== Header ===== */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:62px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:800;font-size:1.25rem;letter-spacing:-.02em}
.brand .mark{width:34px;height:34px;border-radius:9px;background:#1B2550;display:grid;place-items:center;color:#F2B632;font-weight:800;font-size:1.15rem}
.brand small{display:block;white-space:nowrap;font-weight:500;font-size:.72rem;color:var(--muted);letter-spacing:0;margin-top:-4px}
nav.main{display:flex;gap:2px;margin-left:auto}
nav.main a{padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.95rem;white-space:nowrap}
nav.main a[aria-current="page"]{color:var(--text);background:var(--surface-2)}
nav.main a:hover{color:var(--text)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-weight:700;font-size:.9rem;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:700}
@media (max-width:920px){
  nav.main{display:none;position:absolute;top:62px;left:0;right:0;flex-direction:column;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 16px 14px;box-shadow:var(--shadow)}
  nav.main.open{display:flex}
  nav.main a{padding:12px 10px;font-size:1.05rem}
  .menu-btn{display:block;margin-left:auto}
}

/* ===== Common UI ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--radius);background:var(--primary);color:var(--on-primary);padding:12px 18px;font-weight:700;cursor:pointer;text-decoration:none;min-height:46px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn.small{padding:7px 12px;min-height:36px;font-size:.92rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-weight:700;font-size:.95rem}
.field .hint{font-size:.85rem;color:var(--muted);margin-top:-2px}
input[type=number],input[type=text],select,textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);padding:11px 12px;width:100%;min-height:46px}
textarea{min-height:120px;resize:vertical}
input[type=file]{max-width:100%;font-size:.9rem}
input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 20%,transparent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.tag{display:inline-block;font-size:.78rem;font-weight:800;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.tag.pf{background:#E4ECFF;color:#24408F}
.tag.nps{background:#E2F4F1;color:#16635A}
.tag.tax{background:#FBF0D6;color:#7A5300}
:root[data-theme="dark"] .tag.pf{background:#1E2A55;color:#B9C6FF}
:root[data-theme="dark"] .tag.nps{background:#123331;color:#8FDACB}
:root[data-theme="dark"] .tag.tax{background:#33290F;color:#F2C35B}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .tag.pf{background:#1E2A55;color:#B9C6FF}
  :root:not([data-theme="light"]) .tag.nps{background:#123331;color:#8FDACB}
  :root:not([data-theme="light"]) .tag.tax{background:#33290F;color:#F2C35B}
}

/* The memorable element: rubber-stamp source seals */
.stamp{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--stamp);color:var(--stamp);background:var(--stamp-bg);border-radius:5px;padding:2px 9px;font-weight:800;font-size:.8rem;line-height:1.4;transform:rotate(-1.5deg);text-decoration:none;max-width:calc(100% - 6px)}
.stamp::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--stamp);flex:none}
.stamp.live{}
.stamp.ann{border-style:dashed}
a.stamp:hover{transform:rotate(0)}
.cite{display:inline-block;border:1.5px solid var(--stamp);color:var(--stamp);border-radius:4px;padding:0 5px;font-size:.78rem;font-weight:800;cursor:pointer;background:transparent;line-height:1.5;margin:0 2px}

.status{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.85rem;padding:3px 10px;border-radius:999px}
.status.ok{background:var(--ok-bg);color:var(--ok)}
.status.warn{background:var(--warn-bg);color:var(--warn)}
.status.bad{background:var(--bad-bg);color:var(--bad)}
.note{border-left:4px solid var(--hi);background:var(--surface-2);padding:12px 14px;border-radius:0 var(--radius) var(--radius) 0}
.note.bad{border-color:var(--bad)}
.note.ok{border-color:var(--ok)}

/* ===== Home ===== */
.hero{padding:44px 0 18px}
.hero p.lead{font-size:1.2rem;color:var(--muted);max-width:640px}
.situations{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin-top:26px;border-top:2px solid var(--text)}
@media (max-width:720px){.situations{grid-template-columns:1fr}}
.sit{display:flex;gap:14px;align-items:flex-start;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:18px 6px;cursor:pointer;color:var(--text)}
.situations .sit:nth-child(odd){border-right:1px solid var(--line);padding-right:18px}
.situations .sit:nth-child(even){padding-left:18px}
@media (max-width:720px){.situations .sit:nth-child(odd){border-right:0;padding-right:6px}.situations .sit:nth-child(even){padding-left:6px}}
.sit:hover{background:var(--surface)}
.sit .t{display:block;font-weight:800;font-size:1.2rem;line-height:1.25}
.sit .d{display:block;color:var(--muted);font-size:.95rem;margin-top:2px}
.sit .tag{margin-top:4px;flex:none;min-width:40px;text-align:center}
.promises{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;padding:30px 0;margin:26px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
@media (max-width:720px){.promises{grid-template-columns:1fr;gap:14px}}
.promises b{display:block;font-size:1.05rem}
.promises span{color:var(--muted);font-size:.95rem}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:10px 0 14px}

/* ===== Rules ===== */
.rule{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px 20px;scroll-margin-top:80px}
.rule .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.rule h3{margin-bottom:6px}
.rule p{margin:0 0 10px}
.rule.flash{box-shadow:0 0 0 3px var(--hi)}
.rules-list{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.date{font-weight:700;color:var(--muted);font-size:.85rem}

/* ===== Tools ===== */
.tool-head{padding:34px 0 10px}
.tool-head p{color:var(--muted);max-width:680px;font-size:1.08rem}
.q{display:grid;grid-template-columns:1fr auto;gap:10px 18px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.q .qt{font-weight:600}
.q .qw{font-size:.88rem;color:var(--muted);display:block;font-weight:400}
@media (max-width:720px){.q{grid-template-columns:1fr}}
.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.score .big{font-size:3.2rem;font-weight:800;line-height:1}
.dots{font-size:1.4rem;letter-spacing:2px}
.fix{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;background:var(--surface)}
.fix h4{margin:0 0 6px;font-size:1.02rem}
.fix ol,.fix ul{margin:6px 0 0;padding-left:20px}
.fix li{margin:3px 0}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps>li{counter-increment:s;position:relative;padding:0 0 18px 46px;border-left:2px solid var(--line);margin-left:15px}
.steps>li:last-child{border-left-color:transparent}
.steps>li::before{content:counter(s);position:absolute;left:-16px;top:-2px;width:30px;height:30px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:800;font-size:.9rem}
.steps>li b{display:block}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 16px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:800;text-align:right}
.bar{display:flex;height:34px;border-radius:8px;overflow:hidden;margin:10px 0 6px;border:1px solid var(--line)}
.bar>div{display:grid;place-items:center;font-weight:800;font-size:.85rem;color:#fff;min-width:0;white-space:nowrap;overflow:hidden}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.88rem;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:8px 0 18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--hi)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.sticky{position:sticky;top:80px}
@media (max-width:860px){.sticky{position:static}}

/* ===== Chat ===== */
.chat{display:flex;flex-direction:column;gap:12px;min-height:280px}
.msg{max-width:88%;padding:12px 15px;border-radius:14px;white-space:normal}
.msg.u{align-self:flex-end;background:var(--primary);color:var(--on-primary);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a ul{margin:6px 0;padding-left:20px}
.msg p:last-child{margin-bottom:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.92rem;text-align:left}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:52px;height:52px}
.typing{color:var(--muted);font-style:italic}

/* ===== Footer & help ===== */
footer{margin-top:60px;border-top:1px solid var(--line);padding:30px 0 90px;color:var(--muted);font-size:.92rem}
footer b{color:var(--text)}
.help-fab{position:fixed;right:16px;bottom:16px;z-index:30;box-shadow:0 10px 30px -10px rgba(0,0,0,.45);border-radius:999px}
@media (max-width:720px){.help-fab{padding:8px 14px;min-height:40px;font-size:.9rem;right:12px;bottom:12px}}
dialog{border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);color:var(--text);max-width:520px;width:calc(100% - 32px);padding:22px}
dialog::backdrop{background:rgba(10,14,30,.55)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.fade-in{animation:fade .35s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media print{header.top,.help-fab,footer,.no-print{display:none!important}body{background:#fff}}
</style>
</head>

    <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="mainNav">Menu</button>

<main id="app" class="wrap" tabindex="-1"></main>

<script>
/* =====================================================================
   CONFIG — edit these before publishing
   ===================================================================== */
const CONFIG = {

  // APIs & Services > Credentials > your key > Application restrictions > Websites

};

/* =====================================================================
   RULES REGISTER — the single source of truth for every tool and the AI.
   Each rule: area, status (live | announced), effective date, source.
   ===================================================================== */
const RULES = [
 {id:"R1",area:"pf",status:"live",date:"2026-07-01",
  title:{en:"New EPF Scheme, 2026 is in force",ta:"புதிய EPF Scheme, 2026 அமலில் உள்ளது"},
  body:{en:"The Employees' Provident Fund Scheme, 2026 (under the Code on Social Security, 2020) replaced the 1952 scheme. It was notified on 29 June 2026 and applies from 1 July 2026. Your UAN and balance do not change. The withdrawal and settlement rules on this site follow the new scheme.",
        ta:"Code on Social Security, 2020-இன் கீழ் வந்த EPF Scheme, 2026, பழைய 1952 scheme-க்கு பதிலாக வந்துள்ளது. 29 ஜூன் 2026 அன்று அறிவிக்கப்பட்டு 1 ஜூலை 2026 முதல் அமலில் உள்ளது. உங்கள் UAN, balance எதுவும் மாறாது. இந்த தளத்தில் உள்ள withdrawal, settlement விதிகள் புதிய scheme-ஐ ஒட்டியவை."},
  src:"Gazette G.S.R. 525(E), 29 Jun 2026",url:"https://egazette.gov.in"},
 {id:"R2",area:"pf",status:"live",date:"2026-07-01",
  title:{en:"Partial withdrawal: 3 categories, 12 months of membership",ta:"Partial withdrawal: 3 வகைகள், 12 மாத உறுப்பினர் காலம்"},
  body:{en:"The old 13 withdrawal reasons are merged into three: Essential needs (illness, education, marriage), Housing needs, and Special circumstances. A uniform 12 months of membership is needed. Education can be claimed up to 10 times and marriage up to 5 times. Under Special circumstances you no longer have to state a reason. Most claims need no documents.",
        ta:"பழைய 13 காரணங்கள் இப்போது மூன்றாக இணைக்கப்பட்டுள்ளன: அத்தியாவசிய தேவைகள் (மருத்துவம், கல்வி, திருமணம்), வீட்டுத் தேவைகள், சிறப்பு சூழ்நிலைகள். எல்லாவற்றுக்கும் 12 மாத உறுப்பினர் காலம் போதும். கல்விக்கு 10 முறை, திருமணத்துக்கு 5 முறை வரை எடுக்கலாம். சிறப்பு சூழ்நிலையில் காரணம் சொல்ல வேண்டியதில்லை. பெரும்பாலான claim-களுக்கு document தேவையில்லை."},
  src:"EPFO CBT 238th meeting, 13 Oct 2025; EPF Scheme 2026",url:"https://www.epfindia.gov.in"},
 {id:"R3",area:"pf",status:"live",date:"2026-07-01",
  title:{en:"25% of your PF must stay in the account",ta:"உங்கள் PF-இல் 25% கணக்கில் இருக்க வேண்டும்"},
  body:{en:"For partial withdrawals, a minimum balance of 25% of contributions (your share, employer share and interest) stays in the account so it keeps earning interest. In practice you can take up to about 75%, now including the employer share. The 25% is released only on full settlement (retirement, 12 months of unemployment, permanent disability, moving abroad and similar events).",
        ta:"Partial withdrawal செய்யும்போது, contribution-களில் (உங்கள் பங்கு, employer பங்கு, வட்டி) 25% minimum balance-ஆக கணக்கில் இருக்கும்; அதற்கு வட்டி தொடர்ந்து கிடைக்கும். நடைமுறையில் சுமார் 75% வரை எடுக்கலாம், employer பங்கும் சேர்த்து. இந்த 25% முழு settlement-இல் மட்டுமே கிடைக்கும் (ஓய்வு, 12 மாத வேலையின்மை, நிரந்தர இயலாமை, வெளிநாட்டில் நிரந்தரமாக குடியேறுதல் போன்றவை)."},
  src:"EPF Scheme 2026, para 46",url:"https://www.epfindia.gov.in"},
 {id:"R4",area:"pf",status:"live",date:"2026-07-01",
  title:{en:"Lost your job? Full PF after 12 months, EPS after 36 months",ta:"வேலை போச்சா? முழு PF 12 மாதம் கழித்து, EPS 36 மாதம் கழித்து"},
  body:{en:"Premature final settlement of PF now needs 12 months of continuous unemployment (earlier 2 months). Withdrawal of the pension (EPS) part needs 36 months (earlier 2 months). While you wait, you can still take a partial withdrawal of up to the eligible 75%.",
        ta:"வேலை இல்லாத நிலையில் PF முழு settlement-க்கு இப்போது தொடர்ச்சியாக 12 மாத வேலையின்மை தேவை (முன்பு 2 மாதம்). Pension (EPS) பகுதியை எடுக்க 36 மாதம் (முன்பு 2 மாதம்). காத்திருக்கும் போதும், தகுதியான 75% வரை partial withdrawal எடுக்கலாம்."},
  src:"EPFO CBT 238th meeting, 13 Oct 2025; EPF Scheme 2026",url:"https://www.epfindia.gov.in"},
 {id:"R5",area:"pf",status:"live",date:"2026-07-01",
  title:{en:"When you can take 100% of your PF",ta:"PF முழுவதையும் எப்போது எடுக்கலாம்"},
  body:{en:"Full settlement is allowed on retirement after age 55, permanent and total disability, permanent migration abroad or employment overseas, retrenchment, voluntary retirement, and after 12 continuous months without covered employment.",
        ta:"55 வயதுக்கு பிறகு ஓய்வு, நிரந்தர முழு இயலாமை, வெளிநாட்டில் நிரந்தர குடியேற்றம் அல்லது வேலை, retrenchment, voluntary retirement, மற்றும் தொடர்ச்சியாக 12 மாதம் PF உள்ள வேலை இல்லாத நிலையில் முழு settlement அனுமதிக்கப்படும்."},
  src:"EPF Scheme 2026, para 49",url:"https://www.epfindia.gov.in"},
 {id:"R6",area:"pf",status:"live",date:"2026-07-01",
  title:{en:"EPFO must settle claims within 20 days",ta:"EPFO 20 நாட்களுக்குள் claim-ஐ முடிக்க வேண்டும்"},
  body:{en:"The new scheme sets a 20-day deadline to settle a complete claim, and provides penal interest (12%) for delay without sufficient cause. Quote this when you escalate a delayed claim.",
        ta:"முழுமையான claim-ஐ 20 நாட்களுக்குள் settle செய்ய வேண்டும் என்று புதிய scheme சொல்கிறது; காரணம் இல்லாத தாமதத்துக்கு 12% penal interest உண்டு. தாமதமான claim-க்கு புகார் கொடுக்கும் போது இதைக் குறிப்பிடுங்கள்."},
  src:"EPF Scheme 2026",url:"https://www.epfindia.gov.in"},
 {id:"R7",area:"pf",status:"live",date:"2025-06-01",
  title:{en:"Auto-settlement up to ₹5 lakh",ta:"₹5 லட்சம் வரை auto-settlement"},
  body:{en:"Advance claims up to ₹5 lakh can be settled automatically, without an officer checking them, if your KYC is complete: Aadhaar linked and verified, PAN verified, bank account seeded and verified. Clean KYC is the single biggest reason claims go through fast.",
        ta:"உங்கள் KYC முழுமையாக இருந்தால் (Aadhaar link & verify, PAN verify, bank account seed & verify), ₹5 லட்சம் வரையிலான advance claim-கள் அதிகாரி பார்க்காமலே தானாக settle ஆகும். Claim வேகமாக முடிய clean KYC தான் முக்கிய காரணம்."},
  src:"EPFO / Ministry of Labour, 2025",url:"https://www.epfindia.gov.in"},
 {id:"R8",area:"pf",status:"live",date:"2025-01-15",
  title:{en:"Transfer PF without employer approval",ta:"Employer அனுமதி இல்லாமல் PF transfer"},
  body:{en:"Since a circular of 15 Jan 2025, most online transfer claims (Form 13) skip employer attestation when your UAN is Aadhaar-verified and details match. From 25 Apr 2025 the destination PF office no longer has to process the transfer: once the source office approves, the money and your pension service move automatically.",
        ta:"15 ஜனவரி 2025 circular முதல், UAN Aadhaar-verified ஆகவும் விவரங்கள் பொருந்தியும் இருந்தால், பெரும்பாலான online transfer claim-களுக்கு (Form 13) employer attestation தேவையில்லை. 25 ஏப்ரல் 2025 முதல், source office approve செய்தவுடன் பணமும் pension service-உம் தானாக புதிய கணக்குக்கு வந்துவிடும்."},
  src:"EPFO circulars, 15 Jan 2025 and 25 Apr 2025",url:"https://www.epfindia.gov.in"},
 {id:"R9",area:"pf",status:"live",date:"2025-01-18",
  title:{en:"Fix your name, DOB and other details yourself",ta:"பெயர், பிறந்த தேதி போன்றவற்றை நீங்களே திருத்தலாம்"},
  body:{en:"With an Aadhaar-verified UAN, you can self-correct common errors (name, date of birth, gender, nationality, parents' names, marital status, spouse name, dates of joining and leaving) online, without employer verification. If your UAN was issued before 1 Oct 2017 the employer may need to make the change. If Aadhaar is not linked, a physical Joint Declaration through the employer is still needed.",
        ta:"UAN Aadhaar-verified ஆக இருந்தால், பெயர், பிறந்த தேதி, பாலினம், பெற்றோர் பெயர், திருமண நிலை, வேலை சேர்ந்த/விட்ட தேதி போன்ற பிழைகளை employer இல்லாமலே online-இல் நீங்களே திருத்தலாம். UAN 1 அக்டோபர் 2017-க்கு முன் வந்திருந்தால் employer மாற்ற வேண்டி வரலாம். Aadhaar link இல்லையென்றால் employer மூலம் Joint Declaration தேவை."},
  src:"Ministry of Labour, Jan 2025",url:"https://www.epfindia.gov.in"},
 {id:"R10",area:"pf",status:"live",date:"2026-09-17",
  title:{en:"PF wage ceiling raised to ₹25,000",ta:"PF wage ceiling ₹25,000 ஆக உயர்வு"},
  body:{en:"The statutory wage ceiling went from ₹15,000 to ₹25,000 a month from 17 Sep 2026, the first change since 2014. The employer's pension (EPS) share can now be up to ₹2,083 a month, which raises future EPS pensions. Existing EPF members earning up to ₹25,000 who were outside EPS are being brought into it.",
        ta:"17 செப்டம்பர் 2026 முதல் wage ceiling மாதம் ₹15,000-லிருந்து ₹25,000 ஆக உயர்ந்துள்ளது (2014-க்கு பிறகு முதல் மாற்றம்). Employer-இன் EPS பங்கு இனி மாதம் ₹2,083 வரை; இதனால் எதிர்கால EPS pension அதிகரிக்கும். ₹25,000 வரை சம்பளம் வாங்கி EPS-இல் இல்லாதவர்கள் இப்போது EPS-இல் சேர்க்கப்படுகிறார்கள்."},
  src:"S.O. 5109(E), 17 Sep 2026",url:"https://pib.gov.in"},
 {id:"R11",area:"pf",status:"live",date:"2026-03-02",
  title:{en:"EPF interest for FY 2025-26: 8.25%",ta:"FY 2025-26 EPF வட்டி: 8.25%"},
  body:{en:"The CBT recommended 8.25% for FY 2025-26, unchanged from the previous two years. Interest is credited after the government notifies the rate, so the credit date varies.",
        ta:"FY 2025-26-க்கு CBT 8.25% பரிந்துரைத்தது, முந்தைய இரண்டு ஆண்டுகளைப் போலவே. அரசு அறிவித்த பிறகுதான் வட்டி credit ஆகும், அதனால் தேதி மாறும்."},
  src:"PIB, CBT 239th meeting, 2 Mar 2026",url:"https://www.pib.gov.in/PressReleasePage.aspx?PRID=2234502"},
 {id:"R12",area:"pf",status:"announced",date:"2026-09-15",
  title:{en:"PF withdrawal by UPI or ATM: announced, not yet live",ta:"UPI / ATM மூலம் PF: அறிவிப்பு மட்டும், இன்னும் வரவில்லை"},
  body:{en:"EPFO 3.0 plans withdrawals through UPI and ATM cards, and testing was reported complete in mid-2026. As of our last check there was no general public launch. Use only routes shown on the official EPFO portal or UMANG app, and ignore links or calls offering 'instant PF by UPI'.",
        ta:"EPFO 3.0-இல் UPI, ATM card மூலம் PF எடுக்கும் வசதி திட்டமிடப்பட்டுள்ளது; 2026 நடுவில் testing முடிந்ததாக தகவல். எங்கள் கடைசி சோதனையில் பொதுமக்களுக்கு இன்னும் தொடங்கவில்லை. EPFO portal அல்லது UMANG app-இல் காட்டும் வழிகளை மட்டும் பயன்படுத்துங்கள்; 'உடனே UPI-இல் PF' என்று வரும் link, call-களை நம்ப வேண்டாம்."},
  src:"EPFO 3.0 status, checked Sep 2026",url:"https://www.epfindia.gov.in"},
 {id:"R13",area:"tax",status:"live",date:"2026-04-01",
  title:{en:"TDS on PF before 5 years of service",ta:"5 ஆண்டுக்கு முன் PF எடுத்தால் TDS"},
  body:{en:"If you withdraw your PF balance before 5 years of continuous service (earlier jobs count if you transferred the balance) and the amount is more than ₹50,000, EPFO deducts TDS: 10% if PAN is linked, a much higher rate if not. Form 15G/15H can avoid TDS if your total income is below the taxable limit. After 5 years of continuous service the withdrawal is tax-free. This was Section 192A; under the Income-tax Act, 2025 it is Section 392(7) from 1 Apr 2026.",
        ta:"தொடர்ச்சியான 5 ஆண்டு service-க்கு முன் (பழைய வேலைகளின் PF transfer செய்திருந்தால் அதுவும் சேரும்) ₹50,000-க்கு மேல் PF எடுத்தால் EPFO TDS பிடிக்கும்: PAN link இருந்தால் 10%, இல்லையென்றால் மிக அதிகம். மொத்த வருமானம் வரி வரம்புக்கு கீழ் இருந்தால் Form 15G/15H கொடுத்து TDS தவிர்க்கலாம். 5 ஆண்டுக்குப் பிறகு எடுத்தால் வரி இல்லை. பழைய Section 192A, Income-tax Act 2025-இல் 1 ஏப்ரல் 2026 முதல் Section 392(7)."},
  src:"Income-tax Act, 2025, s.392(7) (old s.192A)",url:"https://www.incometax.gov.in"},
 {id:"R14",area:"pf",status:"live",date:"2026-07-01",
  title:{en:"Your EPS pension: the 10-year line",ta:"உங்கள் EPS pension: 10 ஆண்டு கோடு"},
  body:{en:"With less than 10 years of pensionable service you can take a withdrawal benefit (Form 10C) or keep a Scheme Certificate to carry the service forward. Under 6 months of service gives nothing. At 10 years or more, there is no lump sum: you get a monthly pension from 58 (reduced pension possible from 50). Pension = pensionable salary × pensionable service ÷ 70. Pensionable salary is capped at the wage ceiling.",
        ta:"10 ஆண்டுக்கு குறைவான pensionable service இருந்தால், withdrawal benefit (Form 10C) எடுக்கலாம் அல்லது Scheme Certificate வாங்கி service-ஐ அடுத்த வேலைக்கு கொண்டு செல்லலாம். 6 மாதத்துக்கு குறைவு என்றால் எதுவும் கிடைக்காது. 10 ஆண்டுக்கு மேல் என்றால் lump sum இல்லை: 58 வயதிலிருந்து மாத pension (50 வயதிலிருந்து குறைந்த pension). Pension = pensionable salary × service ஆண்டுகள் ÷ 70; salary wage ceiling வரை மட்டும்."},
  src:"Employees' Pension Scheme, 2026",url:"https://www.epfindia.gov.in"},
 {id:"R15",area:"nps",status:"live",date:"2025-12-16",
  title:{en:"NPS: up to 80% lump sum for non-government subscribers",ta:"NPS: அரசு அல்லாதவர்களுக்கு 80% வரை lump sum"},
  body:{en:"For All Citizen and Corporate NPS subscribers, normal exit now allows up to 80% as lump sum with at least 20% used to buy an annuity (earlier 60:40). Government sector subscribers stay at 60:40.",
        ta:"All Citizen, Corporate NPS சந்தாதாரர்களுக்கு, normal exit-இல் இப்போது 80% வரை lump sum, குறைந்தது 20% annuity (முன்பு 60:40). அரசு ஊழியர்களுக்கு 60:40 அப்படியே."},
  src:"PFRDA (Exits & Withdrawals) Amendment Regulations, Dec 2025",url:"https://www.pfrda.org.in"},
 {id:"R16",area:"nps",status:"live",date:"2025-12-16",
  title:{en:"NPS exit by corpus size",ta:"Corpus அளவைப் பொறுத்து NPS exit"},
  body:{en:"Non-government normal exit: corpus up to ₹8 lakh, take 100% (or withdraw it systematically). ₹8–12 lakh: up to ₹6 lakh as lump sum, the rest by systematic unit redemption over at least 6 years or as annuity (or use the 80:20 route). Above ₹12 lakh: up to 80% lump sum, at least 20% annuity.",
        ta:"அரசு அல்லாதோர் normal exit: corpus ₹8 லட்சம் வரை என்றால் 100% எடுக்கலாம் (அல்லது படிப்படியாக). ₹8–12 லட்சம்: ₹6 லட்சம் வரை lump sum, மீதி குறைந்தது 6 ஆண்டுகளில் systematic redemption அல்லது annuity (அல்லது 80:20). ₹12 லட்சத்துக்கு மேல்: 80% வரை lump sum, குறைந்தது 20% annuity."},
  src:"PFRDA (Exits & Withdrawals) Amendment Regulations, Dec 2025",url:"https://www.pfrda.org.in"},
 {id:"R17",area:"nps",status:"live",date:"2025-12-16",
  title:{en:"Exit after 15 years, stay invested till 85",ta:"15 ஆண்டுக்குப் பிறகு exit, 85 வயது வரை தொடரலாம்"},
  body:{en:"Non-government subscribers can make a normal exit at 60 or after 15 years of subscription, whichever is earlier. Anyone can defer withdrawal or annuity purchase up to age 85 (earlier 75).",
        ta:"அரசு அல்லாதோர் 60 வயதில் அல்லது 15 ஆண்டு சந்தா முடிந்தவுடன், எது முன்னதோ, normal exit செய்யலாம். Withdrawal அல்லது annuity வாங்குவதை 85 வயது வரை தள்ளிப்போடலாம் (முன்பு 75)."},
  src:"PFRDA (Exits & Withdrawals) Amendment Regulations, Dec 2025",url:"https://www.pfrda.org.in"},
 {id:"R18",area:"nps",status:"live",date:"2025-12-16",
  title:{en:"Leaving NPS early: 20% lump sum, 80% annuity",ta:"NPS-ஐ முன்கூட்டியே விட்டால்: 20% lump sum, 80% annuity"},
  body:{en:"Premature exit: if the corpus is ₹5 lakh or less you can take it all. Above ₹5 lakh, only 20% comes as lump sum and at least 80% must buy an annuity. The 5-year minimum before premature exit has been removed for non-government subscribers; it still applies to government subscribers.",
        ta:"முன்கூட்டியே exit: corpus ₹5 லட்சம் அல்லது குறைவு என்றால் முழுவதும் எடுக்கலாம். ₹5 லட்சத்துக்கு மேல் என்றால் 20% மட்டுமே lump sum, குறைந்தது 80% annuity. அரசு அல்லாதோருக்கு 5 ஆண்டு கட்டாய காலம் நீக்கப்பட்டுள்ளது; அரசு ஊழியர்களுக்கு தொடரும்."},
  src:"PFRDA (Exits & Withdrawals) Amendment Regulations, Dec 2025",url:"https://www.pfrda.org.in"},
 {id:"R19",area:"nps",status:"live",date:"2025-12-16",
  title:{en:"NPS partial withdrawal: 4 times before 60",ta:"NPS partial withdrawal: 60-க்கு முன் 4 முறை"},
  body:{en:"After 3 years in NPS you can withdraw up to 25% of your own contributions (not the employer's, not the returns). Up to 4 times before 60 with a 4-year gap; after 60, once every 3 years. Purposes include children's education and marriage, buying or building a first house, medical treatment, and settling a loan taken against NPS. Skill development and starting a business were removed as purposes.",
        ta:"NPS-இல் 3 ஆண்டு முடிந்த பிறகு, உங்கள் சொந்த contribution-இல் 25% வரை எடுக்கலாம் (employer பங்கு, லாபம் அல்ல). 60-க்கு முன் 4 முறை, ஒவ்வொன்றுக்கும் 4 ஆண்டு இடைவெளி; 60-க்கு பிறகு 3 ஆண்டுக்கு ஒருமுறை. குழந்தைகளின் கல்வி, திருமணம், முதல் வீடு, மருத்துவம், NPS மீது வாங்கிய கடனை அடைத்தல் போன்ற காரணங்கள். Skill development, தொழில் தொடங்குதல் நீக்கப்பட்டுள்ளன."},
  src:"PFRDA (Exits & Withdrawals) Amendment Regulations, Dec 2025",url:"https://www.pfrda.org.in"},
 {id:"R20",area:"nps",status:"live",date:"2025-12-16",
  title:{en:"Loan against your NPS",ta:"உங்கள் NPS மீது கடன்"},
  body:{en:"A regulated lender can now mark a lien on up to 25% of your own NPS contributions and lend against it, while the corpus stays invested.",
        ta:"ஒழுங்குபடுத்தப்பட்ட நிதி நிறுவனம், உங்கள் சொந்த NPS contribution-இல் 25% வரை lien வைத்து கடன் தரலாம்; corpus தொடர்ந்து முதலீட்டில் இருக்கும்."},
  src:"PFRDA (Exits & Withdrawals) Amendment Regulations, Dec 2025",url:"https://www.pfrda.org.in"},
 {id:"R21",area:"tax",status:"live",date:"2026-04-01",
  title:{en:"NPS withdrawal tax: only 60% is tax-free",ta:"NPS withdrawal வரி: 60% மட்டுமே வரி இல்லாதது"},
  body:{en:"At exit, a lump sum up to 60% of the corpus is tax-free. PFRDA now allows 80%, but tax law has not been changed to match, so the extra 20% is taxed at your slab. Annuity income is taxed every year at your slab. Partial withdrawals (up to 25% of own contributions) are tax-free. Budget 2026 made no NPS tax changes.",
        ta:"Exit-இல் corpus-இன் 60% வரை lump sum வரி இல்லாதது. PFRDA 80% அனுமதித்தாலும் வரி சட்டம் இன்னும் மாறவில்லை, அதனால் கூடுதல் 20%-க்கு உங்கள் slab வரி. Annuity வருமானத்துக்கு ஒவ்வொரு ஆண்டும் slab வரி. Partial withdrawal (சொந்த contribution-இல் 25% வரை) வரி இல்லாதது. Budget 2026-இல் NPS வரி மாற்றம் இல்லை."},
  src:"Income-tax Act (old s.10(12A), 10(12B)); Budget 2026",url:"https://www.incometax.gov.in"},
 {id:"R22",area:"tax",status:"live",date:"2026-04-01",
  title:{en:"NPS tax deductions: old vs new regime",ta:"NPS வரி விலக்கு: பழைய vs புதிய regime"},
  body:{en:"New regime: only the employer's NPS contribution is deductible, up to 14% of basic + DA. Old regime: employer contribution up to 10% of basic + DA (non-government), your own contribution within the ₹1.5 lakh 80C limit (capped at 10% of salary), plus an extra ₹50,000 for your own contribution. Employer contributions to EPF, NPS and superannuation together above ₹7.5 lakh a year are taxable. Section numbers changed under the Income-tax Act, 2025; the benefits are the same.",
        ta:"புதிய regime: employer NPS contribution மட்டும், basic + DA-வின் 14% வரை விலக்கு. பழைய regime: employer பங்கு 10% வரை (அரசு அல்லாதோர்), உங்கள் பங்கு ₹1.5 லட்சம் 80C வரம்புக்குள் (salary-யின் 10% வரை), அதோடு கூடுதல் ₹50,000. EPF, NPS, superannuation மூன்றிலும் employer பங்கு ஆண்டுக்கு ₹7.5 லட்சத்தை தாண்டினால் வரி உண்டு. Income-tax Act 2025-இல் section எண்கள் மாறியுள்ளன; பலன்கள் அதே."},
  src:"Income-tax Act, 2025 (old s.80CCD)",url:"https://www.incometax.gov.in"},
 {id:"R23",area:"nps",status:"live",date:"2025-12-16",
  title:{en:"Multiple Scheme Framework: up to 100% equity",ta:"Multiple Scheme Framework: 100% வரை equity"},
  body:{en:"Non-government subscribers can hold schemes under the Multiple Scheme Framework, some of which allow up to 100% equity. The standard Active Choice equity cap for the common scheme is 75%.",
        ta:"அரசு அல்லாதோர் Multiple Scheme Framework திட்டங்களில் இருக்கலாம்; சிலவற்றில் 100% வரை equity. சாதாரண common scheme-இல் Active Choice equity வரம்பு 75%."},
  src:"PFRDA, MSF incorporated Dec 2025",url:"https://www.pfrda.org.in"}
];

 {id:"match",w:3,q:{en:"Name, date of birth and gender in EPFO exactly match my Aadhaar",ta:"EPFO-வில் பெயர், பிறந்த தேதி, பாலினம் Aadhaar-உடன் சரியாக பொருந்துகின்றன"},
  why:{en:"Even an initial or spelling difference blocks claims.",ta:"ஒரு initial அல்லது spelling வேறுபாடு கூட claim-ஐ நிறுத்தும்."},
  fix:{en:["Compare your EPFO profile with Aadhaar letter by letter.","With an Aadhaar-verified UAN, correct it yourself: Manage > Modify basic details.","Older UANs (before Oct 2017) or no Aadhaar link: ask the employer to submit a Joint Declaration."],ta:["EPFO profile-ஐ Aadhaar-உடன் எழுத்துக்கு எழுத்து ஒப்பிடுங்கள்.","Aadhaar-verified UAN என்றால் நீங்களே திருத்துங்கள்: Manage > Modify basic details.","பழைய UAN (அக்டோபர் 2017-க்கு முன்) அல்லது Aadhaar link இல்லை என்றால், employer மூலம் Joint Declaration."]}},
 {id:"oneuan",w:2,q:{en:"I have only one UAN (no second UAN from an old job)",ta:"எனக்கு ஒரே ஒரு UAN தான் (பழைய வேலையிலிருந்து இரண்டாவது UAN இல்லை)"},
  why:{en:"A second UAN splits your money and service.",ta:"இரண்டாவது UAN உங்கள் பணத்தையும் service-ஐயும் பிரிக்கும்."},
  fix:{en:["Keep the UAN linked to Aadhaar as your main one.","Transfer the old UAN's member IDs into it via 'One Member – One EPF Account'.","Ask EPFO (helpdesk or EPFiGMS) to deactivate the duplicate UAN."],ta:["Aadhaar link ஆன UAN-ஐ முதன்மையாக வைத்திருங்கள்.","'One Member – One EPF Account' மூலம் பழைய UAN-இன் member ID-களை அதில் transfer செய்யுங்கள்.","கூடுதல் UAN-ஐ deactivate செய்ய EPFO-விடம் (helpdesk அல்லது EPFiGMS) கேளுங்கள்."]}},
 {id:"merged",w:2,q:{en:"PF from all my old jobs has been transferred into my current account",ta:"பழைய எல்லா வேலைகளின் PF-உம் தற்போதைய கணக்குக்கு transfer ஆகிவிட்டது"},
  why:{en:"Untransferred PF breaks continuous service and can make withdrawals taxable.",ta:"Transfer ஆகாத PF service தொடர்ச்சியை உடைக்கும்; withdrawal-க்கு வரி வரலாம்."},
  fix:{en:["Portal: Online Services > One Member – One EPF Account (Transfer Request).","Use the Job change tool on this site for your exact steps."],ta:["Portal: Online Services > One Member – One EPF Account (Transfer Request).","உங்களுக்கான சரியான படிகளுக்கு இந்த தளத்தின் 'வேலை மாற்றம்' tool-ஐ பயன்படுத்துங்கள்."]}},
 {id:"doe",w:2,q:{en:"Date of exit is marked for every old job",ta:"ஒவ்வொரு பழைய வேலைக்கும் exit தேதி பதிவாகியுள்ளது"},
  why:{en:"Missing exit dates block both transfers and final claims.",ta:"Exit தேதி இல்லையென்றால் transfer, final claim இரண்டும் நிற்கும்."},
  fix:{en:["Check in Service history (passbook).","Two months after the last contribution you can mark it yourself: Manage > Mark Exit.","Enter the real last working day, not today's date."],ta:["Service history (passbook)-இல் பாருங்கள்.","கடைசி contribution-க்கு 2 மாதம் கழித்து நீங்களே mark செய்யலாம்: Manage > Mark Exit.","இன்றைய தேதி அல்ல, உண்மையான கடைசி வேலை நாளைப் போடுங்கள்."]}},
 {id:"nominee",w:1,q:{en:"I have added an e-nomination",ta:"e-nomination சேர்த்துள்ளேன்"},
  why:{en:"Without it, your family has a long, document-heavy process later.",ta:"இது இல்லையென்றால் பின்னால் உங்கள் குடும்பத்துக்கு நீண்ட, நிறைய document தேவைப்படும் process."},
  fix:{en:["Portal: Manage > E-Nomination. Add family members with their Aadhaar.","Takes 5 minutes and needs only an Aadhaar OTP."],ta:["Portal: Manage > E-Nomination. குடும்பத்தினரை அவர்கள் Aadhaar-உடன் சேருங்கள்.","5 நிமிடம் போதும், Aadhaar OTP மட்டும் தேவை."]}},
 {id:"deposits",w:2,q:{en:"My passbook shows employer deposits for every month I worked",ta:"நான் வேலை செய்த ஒவ்வொரு மாதத்துக்கும் employer deposit passbook-இல் உள்ளது"},
  why:{en:"Missing months mean the employer deducted but didn't deposit, or deposited late.",ta:"மாதங்கள் இல்லையென்றால், employer பிடித்தும் deposit செய்யவில்லை அல்லது தாமதமாக செய்தார்."},
  fix:{en:["Download your passbook and match it with payslips.","Raise it with HR first, with the months listed.","If not fixed, file on EPFiGMS against the establishment."],ta:["Passbook download செய்து payslip-களுடன் ஒப்பிடுங்கள்.","முதலில் HR-இடம் மாதங்களைப் பட்டியலிட்டு கேளுங்கள்.","சரியாகவில்லை என்றால் EPFiGMS-இல் நிறுவனத்தின் மீது புகார்."]}},
 {id:"mobile",w:1,q:{en:"The mobile number linked to my Aadhaar is active",ta:"Aadhaar-உடன் link ஆன mobile எண் active-ஆக உள்ளது"},
  why:{en:"Every claim and transfer is confirmed with an Aadhaar OTP.",ta:"ஒவ்வொரு claim, transfer-உம் Aadhaar OTP மூலம் உறுதி செய்யப்படும்."},
  fix:{en:["If it's an old number, update it at an Aadhaar centre first.","Then update it on the EPFO portal under Manage > Contact details."],ta:["பழைய எண் என்றால் முதலில் Aadhaar centre-இல் update செய்யுங்கள்.","பிறகு EPFO portal-இல் Manage > Contact details-இல் update செய்யுங்கள்."]}}
];

/* ===== Rejection reasons library ===== */
const REJ = [
 {id:"bank",kw:["bank","cheque","check leaf","passbook","ifsc","account number","not legible","illegible","blur","image","account details","bank account"],
  t:{en:"Bank details or cheque image problem",ta:"Bank விவரம் அல்லது cheque image பிரச்சனை"},
  m:{en:"EPFO couldn't match the bank account to you: the cheque or passbook image was unclear, your name wasn't printed on it, the IFSC is outdated, or the account isn't verified.",ta:"Bank account உங்களுடையது என்று EPFO உறுதி செய்ய முடியவில்லை: cheque/passbook image தெளிவில்லை, உங்கள் பெயர் அச்சிடப்படவில்லை, IFSC பழையது, அல்லது account verify ஆகவில்லை."},
  f:{en:["Check Manage > KYC > Bank: correct account number and current IFSC, status 'verified'.","Upload a clear, straight photo of a cancelled cheque or passbook first page with your name printed.","Use an account in your own name. Then file the claim again."],ta:["Manage > KYC > Bank: சரியான account எண், தற்போதைய IFSC, 'verified' நிலை.","உங்கள் பெயர் அச்சிட்ட cancelled cheque அல்லது passbook முதல் பக்கத்தின் தெளிவான photo upload செய்யுங்கள்.","உங்கள் பெயரில் உள்ள account பயன்படுத்துங்கள். பிறகு மீண்டும் claim போடுங்கள்."]},rules:["R7"]},
 {id:"name",kw:["name","dob","date of birth","mismatch","not matching","does not match","gender","father","spelling","aadhaar data","demographic"],
  t:{en:"Name, DOB or other details don't match",ta:"பெயர், பிறந்த தேதி அல்லது பிற விவரங்கள் பொருந்தவில்லை"},
  m:{en:"Your details in EPFO differ from Aadhaar, PAN or bank records.",ta:"EPFO-வில் உள்ள உங்கள் விவரங்கள் Aadhaar, PAN அல்லது bank பதிவுகளிலிருந்து வேறுபடுகின்றன."},
  f:{en:["Compare EPFO, Aadhaar, PAN and bank records letter by letter.","With an Aadhaar-verified UAN, correct it yourself: Manage > Modify basic details.","Older UAN or no Aadhaar link: your employer submits a Joint Declaration. Refile after the correction is approved."],ta:["EPFO, Aadhaar, PAN, bank பதிவுகளை எழுத்துக்கு எழுத்து ஒப்பிடுங்கள்.","Aadhaar-verified UAN என்றால் நீங்களே திருத்துங்கள்: Manage > Modify basic details.","பழைய UAN அல்லது Aadhaar link இல்லை என்றால் employer Joint Declaration கொடுக்க வேண்டும். திருத்தம் approve ஆன பிறகு மீண்டும் claim."]},rules:["R9"]},
 {id:"doe",kw:["date of exit","doe","exit date","date of leaving","dol","not left","still in service","service not ceased","member is in service"],
  t:{en:"Date of exit not marked",ta:"Exit தேதி பதிவாகவில்லை"},
  m:{en:"EPFO still sees you as employed at that establishment, so a final claim or transfer can't go through.",ta:"அந்த நிறுவனத்தில் நீங்கள் இன்னும் வேலை செய்வதாக EPFO கருதுகிறது; அதனால் final claim, transfer நடக்காது."},
  f:{en:["Two months after the last contribution, mark it yourself: Manage > Mark Exit (Aadhaar OTP).","Enter your real last working day.","Or ask the old employer to update it. Then refile."],ta:["கடைசி contribution-க்கு 2 மாதம் கழித்து நீங்களே mark செய்யுங்கள்: Manage > Mark Exit (Aadhaar OTP).","உண்மையான கடைசி வேலை நாளைப் போடுங்கள்.","அல்லது பழைய employer-இடம் update செய்ய சொல்லுங்கள். பிறகு மீண்டும் claim."]},rules:["R5"]},
 {id:"service",kw:["service","not eligible","ineligible","minimum","membership","para","not admissible","months of service","eligibility"],
  t:{en:"Not eligible for this type of withdrawal yet",ta:"இந்த வகை withdrawal-க்கு இன்னும் தகுதி இல்லை"},
  m:{en:"The claim didn't meet the membership period or the condition for that purpose. Under the 2026 scheme most partial withdrawals need 12 months of membership, and full settlement after leaving a job needs 12 months of unemployment.",ta:"அந்த காரணத்துக்கான உறுப்பினர் காலம் அல்லது நிபந்தனை பூர்த்தியாகவில்லை. 2026 scheme-இல் பெரும்பாலான partial withdrawal-க்கு 12 மாத உறுப்பினர் காலம்; வேலை விட்ட பிறகு முழு settlement-க்கு 12 மாத வேலையின்மை தேவை."},
  f:{en:["Use the Withdraw PF tool on this site to see what you're eligible for today.","If you left your job less than 12 months ago, apply for a partial withdrawal (up to ~75%) instead of final settlement.","Make sure earlier jobs are transferred so your membership counts fully."],ta:["இன்று எதற்கு தகுதி என்று பார்க்க இந்த தளத்தின் 'PF எடுக்க' tool-ஐ பயன்படுத்துங்கள்.","வேலை விட்டு 12 மாதம் ஆகவில்லை என்றால், final settlement-க்கு பதில் partial withdrawal (~75% வரை) போடுங்கள்.","உறுப்பினர் காலம் முழுதாக கணக்கில் வர பழைய வேலைகளின் PF transfer செய்யுங்கள்."]},rules:["R2","R4"]},
 {id:"transfer",kw:["previous","transfer","multiple member","other member id","old account","pending transfer","member id","not transferred","merge"],
  t:{en:"Old PF accounts need to be transferred first",ta:"முதலில் பழைய PF கணக்குகளை transfer செய்ய வேண்டும்"},
  m:{en:"You have more than one member ID. EPFO wants them consolidated before it settles this claim.",ta:"உங்களுக்கு ஒன்றுக்கு மேற்பட்ட member ID உள்ளது. இந்த claim-ஐ settle செய்யும் முன் அவற்றை ஒன்றாக்க EPFO விரும்புகிறது."},
  f:{en:["File a transfer: Online Services > One Member – One EPF Account.","Wait for it to complete (the scheme sets a 20-day settlement deadline).","Then file the withdrawal from the current member ID."],ta:["Transfer போடுங்கள்: Online Services > One Member – One EPF Account.","அது முடியும் வரை காத்திருங்கள் (scheme 20 நாள் கெடு வைக்கிறது).","பிறகு தற்போதைய member ID-இலிருந்து withdrawal போடுங்கள்."]},rules:["R8","R6"]},
 {id:"kyc",kw:["kyc","aadhaar not","uan not","not seeded","seeding","not linked","verification","authenticat","e-kyc"],
  t:{en:"KYC not complete",ta:"KYC முழுமையாகவில்லை"},
  m:{en:"Aadhaar, PAN or bank isn't verified on your UAN, so the claim can't be authenticated.",ta:"உங்கள் UAN-இல் Aadhaar, PAN அல்லது bank verify ஆகவில்லை; அதனால் claim-ஐ உறுதி செய்ய முடியவில்லை."},
  f:{en:["Portal: Manage > KYC. All three should show 'Verified'.","Ask your current employer to approve pending KYC.","Employer closed? Submit a Joint Declaration at the EPFO regional office."],ta:["Portal: Manage > KYC. மூன்றும் 'Verified' என்று இருக்க வேண்டும்.","Pending KYC-ஐ approve செய்ய தற்போதைய employer-இடம் கேளுங்கள்.","Employer மூடப்பட்டதா? EPFO regional office-இல் Joint Declaration."]},rules:["R7"]},
 {id:"pan15g",kw:["pan","15g","15h","tds","tax"],
  t:{en:"PAN or Form 15G/15H issue",ta:"PAN அல்லது Form 15G/15H பிரச்சனை"},
  m:{en:"For withdrawals before 5 years of service above ₹50,000, EPFO needs PAN (or a valid 15G/15H) to deduct the right TDS.",ta:"5 ஆண்டுக்கு முன் ₹50,000-க்கு மேல் எடுக்கும் போது சரியான TDS பிடிக்க EPFO-வுக்கு PAN (அல்லது சரியான 15G/15H) தேவை."},
  f:{en:["Link and verify PAN under Manage > KYC.","Upload Form 15G (under 60) or 15H (60+) only if your total income is below the taxable limit.","Refile the claim."],ta:["Manage > KYC-இல் PAN link செய்து verify செய்யுங்கள்.","மொத்த வருமானம் வரி வரம்புக்கு கீழ் இருந்தால் மட்டும் Form 15G (60-க்கு கீழ்) அல்லது 15H (60+) upload செய்யுங்கள்.","மீண்டும் claim போடுங்கள்."]},rules:["R13"]},
 {id:"amount",kw:["amount","exceed","more than","eligible amount","limit","balance insufficient"],
  t:{en:"Claimed more than the eligible amount",ta:"தகுதியான தொகையை விட அதிகம் கேட்டுள்ளீர்கள்"},
  m:{en:"The amount asked is above what's allowed. Under the 2026 rules, 25% of your contributions must stay in the account.",ta:"கேட்ட தொகை அனுமதிக்கப்பட்டதை விட அதிகம். 2026 விதிகளில், contribution-களின் 25% கணக்கில் இருக்க வேண்டும்."},
  f:{en:["Check the eligible amount the portal shows while filing.","Ask for that amount or less. Use the Withdraw PF tool for an estimate."],ta:["Claim போடும் போது portal காட்டும் தகுதியான தொகையைப் பாருங்கள்.","அந்த தொகை அல்லது குறைவாக கேளுங்கள். மதிப்பீட்டுக்கு 'PF எடுக்க' tool."]},rules:["R3"]},
 {id:"contrib",kw:["contribution not","not received","no contribution","ecr","not remitted","dues","employer has not"],
  t:{en:"Employer contributions missing",ta:"Employer contribution இல்லை"},
  m:{en:"Contributions for some months were not filed or paid by the employer, so your balance or service is incomplete.",ta:"சில மாதங்களுக்கான contribution-ஐ employer file அல்லது செலுத்தவில்லை; அதனால் balance அல்லது service முழுமையில்லை."},
  f:{en:["Download your passbook and list the missing months.","Send that list to HR in writing.","If not fixed, file an EPFiGMS grievance against the establishment."],ta:["Passbook download செய்து இல்லாத மாதங்களைப் பட்டியலிடுங்கள்.","அந்த பட்டியலை HR-க்கு எழுத்துப்பூர்வமாக அனுப்புங்கள்.","சரியாகவில்லை என்றால் நிறுவனத்தின் மீது EPFiGMS புகார்."]},rules:["R6"]},
 {id:"duplicate",kw:["already settled","duplicate","already paid","already claimed","claim exists"],
  t:{en:"Claim already settled or a duplicate",ta:"Claim ஏற்கனவே settle ஆகிவிட்டது / இரட்டிப்பு"},
  m:{en:"A similar claim is already processed or pending.",ta:"இதே போன்ற claim ஏற்கனவே process ஆகிவிட்டது அல்லது pending."},
  f:{en:["Check Online Services > Track claim status for earlier claims.","Check your bank statement for the credit.","If money never arrived, raise it on EPFiGMS with the claim ID."],ta:["Online Services > Track claim status-இல் முந்தைய claim-களைப் பாருங்கள்.","Bank statement-இல் credit வந்ததா பாருங்கள்.","பணம் வரவில்லை என்றால் claim ID-உடன் EPFiGMS புகார்."]},rules:[]},

const inr = n => "₹" + Math.round(n).toLocaleString("en-IN");
const inrShort = n => { n=Math.round(n); if(n>=1e7) return "₹"+(n/1e7).toFixed(2).replace(/\.?0+$/,"")+" Cr"; if(n>=1e5) return "₹"+(n/1e5).toFixed(2).replace(/\.?0+$/,"")+" L"; return inr(n); };
const fmtDate = iso => { const d=new Date(iso+"T00:00:00"); return d.toLocaleDateString(LANG==="ta"?"ta-IN":"en-IN",{day:"numeric",month:"short",year:"numeric"}); };

function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2200);}
function stampHTML(r){return `<a class="stamp ${r.status==="live"?"live":"ann"}" href="#/rules/${r.id}" title="${esc(r.src)}">${esc(r.src)}</a>`;}
function citeHTML(ids){return (ids||[]).map(id=>ruleById(id)?`<button class="cite" data-cite="${id}" title="${esc(L(ruleById(id).title))}">${id}</button>`:"").join("");}
function areaTag(a){return `<span class="tag ${a}">${a==="pf"?"PF":a==="nps"?"NPS":L(S.tax)}</span>`;}
function seg(name, options, value){return `<div class="seg" role="group">${options.map(o=>`<button type="button" data-seg="${name}" data-v="${o.v}" aria-pressed="${String(o.v)===String(value)}">${esc(L(o.l))}</button>`).join("")}</div>`;}
function num(name,label,value,hint,attrs=""){return `<div class="field"><label for="f_${name}">${esc(L(label))}</label>${hint?`<span class="hint">${esc(L(hint))}</span>`:""}<input type="number" inputmode="decimal" id="f_${name}" data-num="${name}" value="${value}" ${attrs}></div>`;}
async function share(text){
  try{ if(navigator.share){ await navigator.share({text}); return; } }catch(e){ if(e&&e.name==="AbortError") return; }
  try{ await navigator.clipboard.writeText(text); toast(L(S.copied)); }catch(e){ prompt("Copy:",text); }
}

function healthScore(){
  let tot=0,got=0; HQ.forEach(q=>{tot+=q.w; const a=st.health[q.id]; got+= a==="y"?q.w:a==="u"?q.w*.4:0;});
  return Math.round(got/tot*100);
}
function viewHealth(){
  const answered=HQ.filter(q=>st.health[q.id]).length, done=answered===HQ.length;
  let report="";

    const sc=healthScore(); const cls=sc>=85?"ok":sc>=60?"warn":"bad";

    const dots=HQ.map(q=>st.health[q.id]==="y"?"🟢":st.health[q.id]==="u"?"🟡":"🔴").join("");

/* ---- Rejection decoder ---- */
function matchRejection(text){
  const t=" "+text.toLowerCase()+" ";
  const scored=REJ.map(r=>{const hits=r.kw.filter(k=>t.includes(k));return {r,hits,score:hits.reduce((s,k)=>s+k.length,0)};}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
  if(!scored.length) return [];
  const top=scored[0].score; return scored.filter(x=>x.score>=top*0.6).slice(0,3);
}

function calcWithdraw(w){
  const p=w.purpose, bal=+w.bal||0, mem=+w.mem||0, svc=+w.svc||0, age=+w.age||0, un=+w.unemp||0;
  const partial=["illness","education","marriage","housing","special"].includes(p);
  let r={eligible:0,stays:bal,final:false,ok:true,msg:[],form:"Form 31",cite:["R2","R3"]};
  if(partial){
    if(mem<12){r.ok=false;r.msg.push({en:`You need 12 months of membership; you have ${mem}. Transfer earlier jobs' PF first if you had any, since that membership counts.`,ta:`12 மாத உறுப்பினர் காலம் தேவை; உங்களுக்கு ${mem}. பழைய வேலைகளின் PF இருந்தால் முதலில் transfer செய்யுங்கள், அந்த காலமும் சேரும்.`});}
    else { r.eligible=bal*.75; r.stays=bal-r.eligible; }
    const extra={education:{en:"Education can be claimed up to 10 times during your membership.",ta:"உறுப்பினர் காலத்தில் கல்விக்கு 10 முறை வரை எடுக்கலாம்."},marriage:{en:"Marriage (self, children, siblings) can be claimed up to 5 times.",ta:"திருமணத்துக்கு (நீங்கள், பிள்ளைகள், உடன்பிறந்தோர்) 5 முறை வரை."},special:{en:"No reason or documents needed under special circumstances, but the number of claims is limited.",ta:"சிறப்பு சூழ்நிலையில் காரணமோ document-ஓ தேவையில்லை, ஆனால் எண்ணிக்கை வரம்பு உண்டு."},illness:{en:"Covers treatment for you or your family. No documents are needed for most auto-settled claims.",ta:"உங்களுக்கோ குடும்பத்துக்கோ சிகிச்சை. பெரும்பாலான auto-settled claim-களுக்கு document தேவையில்லை."},housing:{en:"Covers buying or building a house, repaying a home loan, and renovation, with limits on how often.",ta:"வீடு வாங்க, கட்ட, home loan அடைக்க, புதுப்பிக்க; எத்தனை முறை என்பதில் வரம்பு உண்டு."}}[p];
    if(extra) r.msg.push(extra);
  } else if(p==="unemployed"){
    r.cite=["R4","R3"];
    if(un<1){r.ok=false;r.msg.push({en:"Wait at least 1 month after leaving your job, then a partial withdrawal of up to ~75% is possible.",ta:"வேலை விட்டு குறைந்தது 1 மாதம் காத்திருங்கள்; பிறகு ~75% வரை partial withdrawal."});}
    else if(un<12){r.eligible=bal*.75;r.stays=bal-r.eligible;r.msg.push({en:`Full settlement needs 12 months without a job; you're at ${un}. Until then you can take up to ~75%. If you join a new job, transfer instead of withdrawing.`,ta:`முழு settlement-க்கு 12 மாத வேலையின்மை தேவை; இப்போது ${un}. அதுவரை ~75% வரை எடுக்கலாம். புதிய வேலையில் சேர்ந்தால் எடுப்பதற்கு பதில் transfer செய்யுங்கள்.`});}
    else {r.eligible=bal;r.stays=0;r.final=true;r.form="Form 19";r.msg.push({en:"You can take the full balance as final settlement.",ta:"முழு balance-ஐயும் final settlement-ஆக எடுக்கலாம்."});}
  } else if(p==="retire"){
    r.cite=["R5"];
    if(age<55){r.ok=false;r.msg.push({en:"Retirement settlement starts at 55. Choose another purpose for now.",ta:"ஓய்வு settlement 55 வயதில் தொடங்கும். இப்போதைக்கு வேறு காரணத்தைத் தேர்ந்தெடுங்கள்."});}
    else {r.eligible=bal;r.stays=0;r.final=true;r.form="Form 19";}
  } else if(p==="abroad"){
    r.cite=["R5"]; r.eligible=bal;r.stays=0;r.final=true;r.form="Form 19";
    r.msg.push({en:"You'll need proof of permanent migration or overseas employment.",ta:"நிரந்தர குடியேற்றம் அல்லது வெளிநாட்டு வேலைக்கான ஆதாரம் தேவை."});
  }
  // tax
  r.tds=0;
  if(r.final && svc<5 && r.eligible>50000){ r.tds = r.eligible*(w.pan==="y"?0.10:0.30); r.cite=[...r.cite,"R13"];
    r.msg.push({en: w.pan==="y"?"TDS of 10% applies because service is under 5 years and the amount is over ₹50,000. Submit Form 15G/15H if your total income is below the taxable limit.":"Without PAN, TDS is at the maximum rate (shown here as an estimate at 30%). Link PAN before you file.",

  }
  const yrs=Math.max(0,58-age); r.growTo=r.eligible*Math.pow(1.0825,yrs); r.yrs=yrs;
  return r;
}

/* ---- NPS planner ---- */
function calcTax(t){
  const basic=+t.basic||0, empAmt=basic*(+t.emp||0)/100, own=+t.own||0, slab=(+t.slab||0)/100;
  const capPct=t.regime==="new"?0.14:0.10;
  const dEmp=Math.min(empAmt,basic*capPct);
  let d80=0,d1b=0;
  if(t.regime==="old"){
    const room80c=Math.max(0,150000-(+t.used80c||0));
    const ownCap=Math.min(own,basic*0.10);
    d80=Math.min(ownCap,room80c);
    d1b=Math.min(50000,own-d80);
  }
  const total=dEmp+d80+d1b;
  return {dEmp,d80,d1b,total,saved:total*slab*1.04,empAmt,over:empAmt>basic*capPct};
}
function exitRules(sector,corpus,normal){
  // returns {lumpMax, annMin, surPart, notes[]}
  const r={lumpMax:0,annMin:0,sur:0,notes:[],cite:["R15","R16"]};
  if(!normal){
    r.cite=["R18"];
    if(corpus<=500000){r.lumpMax=corpus;}
    else {r.lumpMax=corpus*.2;r.annMin=corpus*.8;}
    return r;
  }
  if(corpus<=800000){r.lumpMax=corpus;return r;}
  if(sector==="g"){r.lumpMax=corpus*.6;r.annMin=corpus*.4;return r;}
  if(corpus<=1200000){
    // two routes: ₹6L lump sum + rest SUR/annuity, or 80:20. Show the larger lump sum route.
    const a=Math.max(600000,corpus*.8);
    if(a===600000){r.lumpMax=600000;r.sur=corpus-600000;}
    else {r.lumpMax=corpus*.8;r.annMin=corpus*.2;}
    r.notes.push({en:"For a corpus of ₹8–12 lakh you can also take ₹6 lakh as lump sum and the rest by systematic withdrawal over at least 6 years, with no annuity.",ta:"₹8–12 லட்சம் corpus என்றால், ₹6 லட்சம் lump sum, மீதியை குறைந்தது 6 ஆண்டுகளில் படிப்படியாக எடுக்கலாம்; annuity தேவையில்லை."});
    return r;
  }
  r.lumpMax=corpus*.8;r.annMin=corpus*.2;return r;
}
function calcRet(x){
  const age=+x.age||0, exitAge=Math.max(age,+x.exitAge||60), yrsNow=+x.yrs||0;
  const months=Math.round((exitAge-age)*12);
  const rm=Math.pow(1+(+x.ret||0)/100,1/12)-1;
  let c=+x.corpus||0, m=+x.monthly||0;
  for(let i=0;i<months;i++){ if(i>0&&i%12===0) m*=1+(+x.step||0)/100; c=c*(1+rm)+m; }
  const totalYrs=yrsNow+(exitAge-age);
  const normal = exitAge>=60 || (x.sector==="ng" && totalYrs>=15);
  const e=exitRules(x.sector,c,normal);
  const taxFree=Math.min(e.lumpMax,c*.6), taxable=Math.max(0,e.lumpMax-taxFree);
  const pension=e.annMin*(+x.ann||0)/100/12;
  return {corpus:c,normal,totalYrs,...e,taxFree,taxable,pension};
}

function mdLite(s){
  let h=esc(s);
  h=h.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  h=h.replace(/\[(R\d{1,2})\]/g,(m,id)=>ruleById(id)?`<button class="cite" data-cite="${id}">${id}</button>`:m);
  const lines=h.split(/\n/); let out="",inList=false;
  for(const ln of lines){
    const m=ln.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/);
    if(m){ if(!inList){out+="<ul>";inList=true;} out+=`<li>${m[1]}</li>`; }
    else { if(inList){out+="</ul>";inList=false;} if(ln.trim()) out+=`<p>${ln}</p>`; }
  }
  if(inList) out+="</ul>";
  return out;
}
function viewAsk(){
  const msgs = st.chat.map(m=>`<div class="msg ${m.role==="user"?"u":"a"}">${m.role==="user"?esc(m.text):mdLite(m.text)}</div>`).join("");
  return `<section class="tool-head"><h1>${esc(L(S.aH))}</h1><p>${esc(L(S.aP))}</p></section>
  <section class="card stack" style="max-width:820px">
    <div class="chat" id="chat" aria-live="polite">${msgs || `<div class="chips">${S.quick.map((q,i)=>`<button data-quick="${i}">${esc(L(q))}</button>`).join("")}</div>`}${st.chatBusy?`<div class="msg a typing">${esc(L(S.thinking))}</div>`:""}</div>
    <form class="composer" id="askForm"><label class="sr" for="askInput">${esc(L(S.aPh))}</label><textarea id="askInput" placeholder="${esc(L(S.aPh))}" rows="1"></textarea><button class="btn" ${st.chatBusy?"disabled":""}>${esc(L(S.send))}</button></form>
  </section>`;
}
const SENSITIVE=/\b\d{12}\b|\b\d{4}\s\d{4}\s\d{4}\b|\b[A-Z]{5}\d{4}[A-Z]\b|\botp\b\s*[:=]?\s*\d{4,8}|\b1\d{11}\b/i;
function systemPrompt(){
  const reg=RULES.map(r=>`[${r.id}] (${r.area.toUpperCase()}, ${r.status}, from ${r.date}; source: ${r.src}) ${r.title.en}: ${r.body.en}`).join("\n");
  const langLine = LANG==="ta" ? "Reply in simple, friendly spoken Tamil (Tamil script), keeping technical terms like PF, UAN, KYC, NPS, TDS, claim, annuity in English." : "Reply in plain, friendly English.";
  return `You are Nidhi360, a helper for Indian salaried people and NPS subscribers with PF (EPFO) and NPS (PFRDA) questions.
Rules you must follow:
1. Answer ONLY from the RULES REGISTER below. After each claim, cite the rule id in square brackets like [R4]. If the register does not cover the question, say so plainly and point to the official source (EPFO portal, PFRDA/NPS Trust, or a tax professional). Never invent rules, numbers, dates or form names.
2. Be specific and practical: what applies to them, the numbers, and the next step on the official portal.
3. Never ask for or accept UAN, PAN, Aadhaar, bank account numbers, passwords or OTPs. If someone shares them, tell them to delete it.
4. This is education, not personalised investment, tax or legal advice. For tax-heavy decisions, suggest a tax professional in one short line.
5. Keep answers under 180 words. Use short bullets for steps.
${langLine}
Rules last checked: ${CONFIG.RULES_CHECKED_ON}.

RULES REGISTER:
${reg}`;
}
async function gemini(contents, sys){
  if(!CONFIG.GEMINI_API_KEY) throw new Error("nokey");
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(CONFIG.GEMINI_MODEL)}:generateContent?key=${encodeURIComponent(CONFIG.GEMINI_API_KEY)}`;
  const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({system_instruction:{parts:[{text:sys}]},contents,generationConfig:{temperature:0.3,maxOutputTokens:1024}})});
  if(!res.ok) throw new Error("http "+res.status);
  const j=await res.json();
  const txt=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("").trim();
  if(!txt) throw new Error("empty");
  return txt;
}
async function ask(q){
  q=(q||"").trim(); if(!q||st.chatBusy) return;
  if(SENSITIVE.test(q)){ st.chat.push({role:"user",text:q.replace(/\d/g,"•")},{role:"model",text:L(S.sensitive)}); render(); return; }
  st.chat.push({role:"user",text:q});
  if(!CONFIG.GEMINI_API_KEY){ st.chat.push({role:"model",text:L(S.noKey)}); render(); return; }
  st.chatBusy=true; render();
  try{
    const contents=st.chat.slice(-10).map(m=>({role:m.role==="user"?"user":"model",parts:[{text:m.text}]}));
    const a=await gemini(contents,systemPrompt());
    st.chat.push({role:"model",text:a});
  }catch(e){ st.chat.push({role:"model",text:L(S.aiErr)}); }
  st.chatBusy=false; render();
  const c=$("#chat"); if(c) c.lastElementChild?.scrollIntoView({block:"nearest",behavior:"smooth"});
}
async function decodeAI(){
  const d=st.dec; if(!d.text.trim() && !d.img) { toast(L(S.dPh)); return; }
  if(!CONFIG.GEMINI_API_KEY){ d.ai=`<p>${esc(L(S.noKey))}</p>`; render(); return; }
  if(SENSITIVE.test(d.text)){ d.ai=`<p>${esc(L(S.sensitive))}</p>`; render(); return; }
  d.aiBusy=true; d.ai=""; render();
  const lib=REJ.map(r=>`- ${r.t.en}: ${r.m.en} Fix: ${r.f.en.join(" ")} Rules: ${r.rules.join(",")}`).join("\n");
  const sys=systemPrompt()+`\n\nKNOWN EPFO REJECTION REASONS:\n${lib}\n\nTask: The user shares an EPFO claim rejection message or screenshot. Explain in under 150 words: what the rejection means, the exact fix steps on the EPFO portal, and when to escalate (EPFiGMS, citing [R6] for the 20-day deadline). If a screenshot shows UAN, Aadhaar, PAN or bank numbers, do not repeat them.`;
  const parts=[{text:"Rejection message: "+(d.text||"(see screenshot)")}];
  if(d.img) parts.push({inline_data:{mime_type:d.imgType,data:d.img}});
  try{ d.ai=mdLite(await gemini([{role:"user",parts}],sys)); }catch(e){ d.ai=`<p>${esc(L(S.aiErr))}</p>`; }
  d.aiBusy=false; render();
}

/* =====================================================================
   ROUTER & RENDER
   ===================================================================== */
function route(){ const h=location.hash.replace(/^#\/?/,"").split("/"); const r=ROUTES.includes(h[0])?h[0]:"home"; return {r, sub:h[1]}; }
function render(){
  const {r,sub}=route();
  document.documentElement.lang=LANG; document.body.classList.toggle("ta",LANG==="ta");
  $("#brandSub").textContent=L(S.brandSub);
  $("#menuBtn").textContent=L(S.menu);
  $("#mainNav").innerHTML=ROUTES.map(k=>`<a href="#/${k==="home"?"":k}" ${k===r?'aria-current="page"':""}>${esc(L(S.nav[k]))}</a>`).join("");
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===LANG)));
  $("#helpFab").textContent=L(S.helpFab);
  const views={home:viewHome,health:viewHealth,decoder:viewDecoder,transfer:viewTransfer,withdraw:viewWithdraw,nps:viewNps,ask:viewAsk,rules:viewRules};
  // keep focus position when re-rendering inputs
  const ae=document.activeElement; const focusKey=ae&&(ae.dataset?.num||ae.id); const selStart=ae&&ae.selectionStart;
  $("#app").innerHTML=views[r]();
  if(focusKey){ const el=document.querySelector(`[data-num="${focusKey}"]`)||document.getElementById(focusKey); if(el&&el!==document.body){ el.focus(); try{ if(selStart!=null&&el.setSelectionRange&&el.type!=="number") el.setSelectionRange(selStart,selStart);}catch(e){} } }
  $("#footer").innerHTML=`<p>${L(S.footer).replace("{d}",fmtDate(CONFIG.RULES_CHECKED_ON))}</p>
   <p><b>${esc(L(S.officialLinks))}:</b> <a href="https://unifiedportal-mem.epfindia.gov.in" target="_blank" rel="noopener">EPFO member portal</a>, <a href="https://epfigms.gov.in" target="_blank" rel="noopener">EPFiGMS</a>, <a href="https://www.npstrust.org.in" target="_blank" rel="noopener">NPS Trust</a>, <a href="https://www.pfrda.org.in" target="_blank" rel="noopener">PFRDA</a>, <a href="https://www.incometax.gov.in" target="_blank" rel="noopener">Income Tax</a></p>
   <p>© ${new Date().getFullYear()} Nidhi360</p>`;
  document.title = (r==="home"?"Nidhi360 — ":L(S.nav[r])+" · Nidhi360 — ")+(LANG==="ta"?"PF & NPS உதவி":"PF & NPS help in your language");
  if(r==="rules"&&sub){ const el=document.getElementById("rule-"+sub); if(el){ el.classList.add("flash"); el.scrollIntoView({block:"center"}); setTimeout(()=>el.classList.remove("flash"),2200);} }
}
let lastRoute="";
window.addEventListener("hashchange",()=>{ const {r}=route(); $("#mainNav").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded","false"); render(); if(r!==lastRoute){ if(!location.hash.includes("/rules/")) window.scrollTo(0,0); $("#app").focus({preventScroll:true}); } lastRoute=r; });

/* ===== Events (delegated) ===== */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-go]"); if(!t) return;
  if(t.dataset.lang){ LANG=t.dataset.lang; store.set("lang",LANG); render(); return; }
  if(t.id==="menuBtn"){ const n=$("#mainNav"); const o=n.classList.toggle("open"); t.setAttribute("aria-expanded",String(o)); return; }
  if(t.dataset.go){ location.hash="#/"+t.dataset.go; return; }
  if(t.dataset.cite){ location.hash="#/rules/"+t.dataset.cite; return; }
  if(t.dataset.tab){ st.ntab=t.dataset.tab; render(); return; }
  if(t.dataset.quick!=null){ ask(L(S.quick[+t.dataset.quick])); return; }
  if(t.dataset.seg){
    const n=t.dataset.seg, v=t.dataset.v;
    if(n.startsWith("h_")){ st.health[n.slice(2)]=v; store.set("health",st.health); }
    else if(n.startsWith("tw_")){ st.tw[n.slice(3)]=v; }
    else if(n==="w_pan"){ st.w.pan=v; }
    else if(n==="tx_regime"){ st.tax.regime=v; }
    else if(n==="tx_slab"){ st.tax.slab=+v; }
    else if(n==="rt_sector"){ st.ret.sector=v; }
    else if(n==="rulesFilter"){ st.rulesFilter=v; }
    render(); return;
  }
  switch(t.dataset.act){
    case "showHealth": st.healthShown=true; render(); setTimeout(()=>$("#report")?.scrollIntoView({behavior:"smooth",block:"start"}),50); break;
    case "resetHealth": st.health={}; st.healthShown=false; store.set("health",{}); render(); window.scrollTo(0,0); break;
    case "shareHealth": { const sc=healthScore(); const dots=HQ.map(q=>st.health[q.id]==="y"?"🟢":st.health[q.id]==="u"?"🟡":"🔴").join("");
      const txt=(LANG==="ta"?`என் PF ஆரோக்கியம்: ${sc}/100\n${dots}\nஉங்க PF claim reject ஆகாம இருக்க 2 நிமிடம் சோதியுங்கள் 👇\n`:`My PF health: ${sc}/100\n${dots}\nCheck yours in 2 minutes before your claim gets rejected 👇\n`)+CONFIG.SITE_URL+"#/health"; share(txt); break; }
    case "print": window.print(); break;
    case "decode": { st.dec.text=$("#decText").value; st.dec.matches=matchRejection(st.dec.text); render(); break; }
    case "decodeAI": { st.dec.text=$("#decText").value; decodeAI(); break; }
    case "resetTw": st.tw={}; render(); break;
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.num){
    const k=t.dataset.num, v=t.value===""?0:+t.value;
    if(k.startsWith("r_")) st.ret[k.slice(2)]=v;
    else if(["basic","emp","own","used80c"].includes(k)) st.tax[k]=v;
    else st.w[k]=v;
    clearTimeout(render._t); render._t=setTimeout(render,250);
  }
  if(t.id==="decText") st.dec.text=t.value;
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.sel==="purpose"){ st.w.purpose=t.value; render(); }
  if(t.id==="decImg" && t.files[0]){
    const f=t.files[0]; if(f.size>4e6){ toast("Max 4 MB"); t.value=""; return; }
    const rd=new FileReader(); rd.onload=()=>{ st.dec.img=String(rd.result).split(",")[1]; st.dec.imgType=f.type; }; rd.readAsDataURL(f);
  }
});
document.addEventListener("submit",e=>{
  if(e.target.id==="askForm"){ e.preventDefault(); const i=$("#askInput"); const v=i.value; i.value=""; ask(v); }
});
document.addEventListener("keydown",e=>{
  if(e.target.id==="askInput" && e.key==="Enter" && !e.shiftKey){ e.preventDefault(); $("#askForm").requestSubmit(); }
});

/* ===== Human help dialog ===== */
$("#helpFab").addEventListener("click",()=>{
  const dlg=$("#helpDlg"); const hasNum=!!CONFIG.WHATSAPP_NUMBER;
  dlg.innerHTML=`<form method="dialog" class="stack" id="helpForm">
    <h2 style="font-size:1.35rem;margin:0">${esc(L(S.helpH))}</h2>
    <p class="muted" style="margin:0">${esc(L(hasNum?S.helpP:S.helpPNoNum))}</p>
    <label class="sr" for="helpText">${esc(L(S.helpH))}</label>
    <textarea id="helpText" required></textarea>
    <div class="row"><button class="btn" value="send" id="helpSend">${esc(L(hasNum?S.helpSend:S.helpCopy))}</button><button class="btn ghost" value="cancel" formnovalidate>${esc(L(S.close))}</button></div>
  </form>`;
  dlg.showModal();
  $("#helpSend").addEventListener("click",ev=>{
    const txt=$("#helpText").value.trim(); if(!txt){ev.preventDefault();return;}
    if(SENSITIVE.test(txt)){ ev.preventDefault(); toast(L(S.sensitive)); return; }
    const {r}=route(); const msg=`Nidhi360 help request (${r}, ${LANG})\n\n${txt}`;
    if(hasNum) window.open(`https://wa.me/${CONFIG.WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`,"_blank","noopener");
    else share(msg);
  });
});

render(); lastRoute=route().r;
</script>
